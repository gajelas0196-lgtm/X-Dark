name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      # 1. Masuk ke folder 'base' dulu
      - name: Set working directory
        run: echo "WORKDIR=./base" >> $GITHUB_ENV

      # 2. Bersihin cache (Biar error StandardFileSystem hilang)
      - name: Clean Cache
        working-directory: ${{ env.WORKDIR }}
        run: flutter clean

      # 3. Get dependencies
      - name: Get dependencies
        working-directory: ${{ env.WORKDIR }}
        run: flutter pub get

      # 4. Build APK
      - name: Build APK
        working-directory: ${{ env.WORKDIR }}
        run: flutter build apk --release

      # 5. Upload APK (Path diarahkan ke folder base)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: base/build/app/outputs/flutter-apk/app-release.apk
